<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Untitled Town</title>
<style>
  :root { --bg:#14131a; --panel:#1d1b26; --line:#2f2c3d; --ink:#e8e4f0; --dim:#8f89a3; --accent:#e0a44a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:13px ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  #wrap { display:flex; height:100vh; }
  #left { flex:1; display:flex; flex-direction:column; min-width:0; }
  canvas#game { background:#20222b; flex:1; width:100%; image-rendering:pixelated; }
  #bottom { border-top:1px solid var(--line); padding:8px 10px; background:var(--panel);
            display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  #right { width:360px; border-left:1px solid var(--line); background:var(--panel);
           display:flex; flex-direction:column; }
  #tabs { display:flex; border-bottom:1px solid var(--line); }
  #tabs button { flex:1; background:none; border:none; color:var(--dim); padding:10px 4px;
                 cursor:pointer; font:inherit; border-bottom:2px solid transparent; }
  #tabs button.on { color:var(--accent); border-bottom-color:var(--accent); }
  .pane { display:none; overflow-y:auto; padding:10px; flex:1; }
  .pane.on { display:block; }
  .mind { border:1px solid var(--line); border-radius:6px; padding:8px; margin-bottom:8px; }
  .mind h4 { margin:0 0 4px; font-size:13px; }
  .mind .th { color:var(--ink); font-style:italic; margin:4px 0; }
  .mind .meta, .dim { color:var(--dim); font-size:11px; }
  .logline { padding:3px 0; border-bottom:1px solid #26232f; font-size:11.5px; line-height:1.45; }
  .logline b { color:var(--accent); }
  button, input, select { font:inherit; }
  .btn { background:#2b2838; color:var(--ink); border:1px solid var(--line);
         border-radius:5px; padding:6px 10px; cursor:pointer; }
  .btn:hover { border-color:var(--accent); color:var(--accent); }
  input[type=text] { background:#14131a; color:var(--ink); border:1px solid var(--line);
                     border-radius:5px; padding:6px 8px; }
  #chatbox { flex:1; min-width:180px; }
  .shopitem { display:flex; gap:8px; align-items:center; border:1px solid var(--line);
              border-radius:6px; padding:6px; margin-bottom:6px; }
  .shopitem img { width:40px; height:40px; object-fit:cover; border-radius:4px; background:#000; }
  .shopitem .n { flex:1; min-width:0; }
  .shopitem .n small { color:var(--dim); display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .thread { border:1px solid var(--line); border-radius:8px; padding:8px; margin-bottom:10px; }
  .thread.live { border-color:var(--accent); }
  .thead { display:flex; justify-content:space-between; align-items:center;
           font-size:11px; color:var(--dim); margin-bottom:6px; }
  .thead .pair b { font-size:12px; }
  .tag { font-size:10px; border:1px solid var(--line); border-radius:99px; padding:1px 7px; }
  .tag.live { color:var(--accent); border-color:var(--accent); }
  .line { margin:5px 0; line-height:1.45; }
  .line .sp { font-weight:bold; }
  .line .tx { color:#cfc9dd; }
  .sec { font-size:11px; color:var(--dim); text-transform:uppercase;
         letter-spacing:.08em; margin:12px 0 6px; }
  .sec:first-child { margin-top:0; }
  .row { display:flex; justify-content:space-between; gap:8px; padding:4px 0;
         border-bottom:1px solid #26232f; font-size:11.5px; }
  .row .r { color:var(--dim); text-align:right; white-space:nowrap; }
  .chain { border:1px solid var(--line); border-radius:8px; padding:9px; line-height:1.7; font-size:11.5px; }
  .chain .arrow { color:var(--dim); }
  .pos { color:#6ed28c; } .neg { color:#e65a5a; }
  #hud { position:absolute; left:14px; top:12px; background:rgba(20,19,26,.82);
         border:1px solid var(--line); border-radius:6px; padding:6px 10px; font-size:12px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="left" style="position:relative">
    <div id="hud">Coins <b id="coins">100</b> · WASD to walk · <b>E</b> to talk</div>
    <canvas id="game"></canvas>
    <div id="bottom">
      <select id="who" class="btn"></select>
      <input id="chatbox" type="text" placeholder="say something… (Enter)">
      <button class="btn" id="sendbtn">Talk</button>
      <button class="btn" id="whisperbtn">Whisper rumour</button>
      <span style="width:12px"></span>
      <span class="dim">god:</span>
      <button class="btn" data-ev="crash">crash</button>
      <button class="btn" data-ev="festival">festival</button>
      <button class="btn" data-ev="shortage">shortage</button>
      <button class="btn" data-ev="stranger">stranger</button>
    </div>
  </div>
  <div id="right">
    <div id="tabs">
      <button class="on" data-p="talk">Talk</button>
      <button data-p="minds">Minds</button>
      <button data-p="rel">Relations</button>
      <button data-p="econ">Economy</button>
      <button data-p="shop">Shop</button>
      <button data-p="log">Log</button>
    </div>
    <div class="pane on" id="talk"></div>
    <div class="pane" id="minds"></div>
    <div class="pane" id="rel"><canvas id="graph" width="330" height="300"></canvas><div id="reltext"></div></div>
    <div class="pane" id="econ"></div>
    <div class="pane" id="shop"></div>
    <div class="pane" id="log"></div>
  </div>
</div>
<script>
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
const gcv = document.getElementById('graph'), gctx = gcv.getContext('2d');
let S = null, keys = {}, player = {x:17, y:11};

const ws = new WebSocket(`ws://${location.host}/ws`);
ws.onmessage = e => {
  const m = JSON.parse(e.data);
  if (m.type === 'state') { S = m; render(); }
  else if (m.type === 'open_url') { if (m.url) window.open(m.url, '_blank'); }
  else if (m.type === 'reply') { /* shows as a speech bubble + in the log */ }
};
const send = o => ws.readyState === 1 && ws.send(JSON.stringify(o));

// ---- input ----
addEventListener('keydown', e => {
  if (document.activeElement === chatbox) {
    if (e.key === 'Enter') talk();
    return;
  }
  keys[e.key.toLowerCase()] = true;
  if (e.key.toLowerCase() === 'e') { const n = nearestAgent(); if (n) { who.value = n.id; chatbox.focus(); } }
});
addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

function nearestAgent() {
  if (!S) return null;
  let best = null, bd = 9;
  for (const a of S.agents) { const d = Math.hypot(a.x - player.x, a.y - player.y); if (d < bd) { bd = d; best = a; } }
  return best;
}
setInterval(() => {
  let dx = (keys.d || keys.arrowright ? 1 : 0) - (keys.a || keys.arrowleft ? 1 : 0);
  let dy = (keys.s || keys.arrowdown ? 1 : 0) - (keys.w || keys.arrowup ? 1 : 0);
  if (dx || dy) {
    player.x = Math.max(.5, Math.min(33.5, player.x + dx * .22));
    player.y = Math.max(.5, Math.min(19.5, player.y + dy * .22));
    send({type:'move', x:player.x, y:player.y});
  }
}, 50);

function talk() {
  const t = chatbox.value.trim(); if (!t) return;
  send({type:'chat', agent: who.value, text: t}); chatbox.value = '';
}
sendbtn.onclick = talk;
whisperbtn.onclick = () => {
  const t = chatbox.value.trim() || prompt('Rumour to whisper:');
  if (t) { send({type:'whisper', agent: who.value, text: t}); chatbox.value = ''; }
};
document.querySelectorAll('[data-ev]').forEach(b => b.onclick = () => send({type:'event', name: b.dataset.ev}));
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('.pane').forEach(p => p.classList.toggle('on', p.id === b.dataset.p));
});

// ---- render ----
function render() {
  const T = Math.min(cv.clientWidth / S.map.w, cv.clientHeight / S.map.h);
  cv.width = cv.clientWidth; cv.height = cv.clientHeight;
  ctx.fillStyle = '#2c3a2a'; ctx.fillRect(0, 0, cv.width, cv.height);

  // grass texture
  ctx.fillStyle = '#334229';
  for (let i = 0; i < S.map.w; i += 1) for (let j = 0; j < S.map.h; j += 1)
    if ((i * 7 + j * 3) % 5 === 0) ctx.fillRect(i * T, j * T, T, T);

  // buildings
  for (const [name, p] of Object.entries(S.map.places)) {
    const [x, y, w, h, col] = p;
    ctx.fillStyle = col; ctx.fillRect(x * T, y * T, w * T, h * T);
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(x * T, y * T, w * T, T * .5);
    ctx.fillStyle = '#efeaf6'; ctx.font = `${Math.max(10, T * .5)}px monospace`; ctx.textAlign = 'center';
    ctx.fillText(name.toUpperCase(), (x + w / 2) * T, (y + h / 2) * T + 4);
  }

  // player
  drawSprite(player.x, player.y, T, '#ffffff', 'You', '', true);
  // agents
  for (const a of S.agents) drawSprite(a.x, a.y, T, a.color, a.name, a.say);

  document.getElementById('coins').textContent = S.player.cash;
  renderTalk(); renderMinds(); renderGraph(T); renderEcon(); renderShop(); renderLog();
  if (!who.options.length) {
    who.innerHTML = S.agents.map(a => `<option value="${a.id}">${esc(a.name)}</option>`).join('');
  }
}

function drawSprite(x, y, T, color, name, say, isPlayer) {
  const px = x * T, py = y * T, r = T * .38;
  ctx.fillStyle = 'rgba(0,0,0,.3)';
  ctx.beginPath(); ctx.ellipse(px, py + r, r, r * .35, 0, 0, 7); ctx.fill();
  ctx.fillStyle = color; ctx.fillRect(px - r, py - r, r * 2, r * 2);
  ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(px - r * .5, py - r * .4, r * .3, r * .3);
  ctx.fillRect(px + r * .2, py - r * .4, r * .3, r * .3);
  if (isPlayer) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.strokeRect(px - r, py - r, r * 2, r * 2); }
  ctx.fillStyle = '#e8e4f0'; ctx.font = `${Math.max(9, T * .38)}px monospace`; ctx.textAlign = 'center';
  ctx.fillText(name, px, py + r * 2.2);
  if (say) bubble(px, py - r * 1.4, say, T);
}

function bubble(px, py, text, T) {
  ctx.font = `${Math.max(10, T * .36)}px monospace`;
  const words = text.split(' '), lines = []; let cur = '';
  for (const w of words) {
    if ((cur + ' ' + w).length > 26) { lines.push(cur); cur = w; } else cur = cur ? cur + ' ' + w : w;
  }
  if (cur) lines.push(cur);
  const lh = Math.max(12, T * .42), wdt = Math.max(...lines.map(l => ctx.measureText(l).width)) + 14;
  const hgt = lines.length * lh + 8, bx = px - wdt / 2, by = py - hgt;
  ctx.fillStyle = 'rgba(248,246,252,.96)';
  ctx.beginPath(); ctx.roundRect(bx, by, wdt, hgt, 6); ctx.fill();
  ctx.beginPath(); ctx.moveTo(px - 5, by + hgt); ctx.lineTo(px + 5, by + hgt); ctx.lineTo(px, by + hgt + 7); ctx.fill();
  ctx.fillStyle = '#17151d'; ctx.textAlign = 'center';
  lines.forEach((l, i) => ctx.fillText(l, px, by + 16 + i * lh - 4));
}

function renderTalk() {
  const cs = (S.conversations || []).slice().reverse();
  if (!cs.length) { talk.innerHTML = '<div class="dim">Nobody is talking yet…</div>'; return; }
  talk.innerHTML = cs.map(c => `
    <div class="thread ${c.closed ? '' : 'live'}">
      <div class="thead">
        <span class="pair">
          <b style="color:${c.colors[0]}">${esc(c.names[0])}</b>
          <span style="color:var(--dim)"> ↔ </span>
          <b style="color:${c.colors[1]}">${esc(c.names[1])}</b>
        </span>
        <span class="tag ${c.closed ? '' : 'live'}">${c.closed ? 'ended' : 'talking…'} · ${c.lines.length}</span>
      </div>
      ${c.lines.map(l => {
        const col = l.speaker === c.a ? c.colors[0] : c.colors[1];
        return `<div class="line"><span class="sp" style="color:${col}">${esc(l.name)}:</span>
                <span class="tx">${esc(l.text)}</span></div>`;
      }).join('')}
    </div>`).join('');
}

function renderEcon() {
  const A = {}; S.agents.forEach(a => A[a.id] = a);
  const c = col => `style="color:${col}"`;
  const nm = id => A[id] ? `<b ${c(A[id].color)}>${esc(A[id].name)}</b>` : esc(id);

  const jobs = S.agents.filter(a => a.employer).map(a =>
    `<div class="row"><span>${nm(a.id)} works for ${nm(a.employer)}</span>
     <span class="r">${a.wage}c / shift</span></div>`).join('') || '<div class="dim">nobody is employed</div>';

  const debts = S.agents.filter(a => a.debt > 0).map(a =>
    `<div class="row"><span>${nm(a.id)} owes the bank</span>
     <span class="r neg">${a.debt}c</span></div>`).join('') || '<div class="dim">no outstanding debt</div>';

  const shelves = S.shop.map(i => {
    const margin = i.price - i.cost;
    return `<div class="row">
      <span>${esc(i.name)}</span>
      <span class="r">${i.qty === 0 ? '<span class="neg">SOLD OUT</span>' : i.qty + ' left'}
        · ${i.cost}c → ${i.price}c
        <span class="${margin >= 0 ? 'pos' : 'neg'}">${margin >= 0 ? '+' : ''}${margin}</span></span>
    </div>`;
  }).join('');

  const flows = (S.flows || []).slice().reverse().map(f =>
    `<div class="row"><span>${esc(f.from)} <span class="arrow">→</span> ${esc(f.to)}
     <span class="dim">${esc(f.why)}</span></span>
     <span class="r">${f.amount}c</span></div>`).join('') || '<div class="dim">no coin has moved yet</div>';

  econ.innerHTML = `
    <div class="sec">the chain</div>
    <div class="chain">
      Townsfolk <span class="arrow">→ buy from →</span> ${nm('mira')}<br>
      ${nm('fig')} <span class="arrow">grows goods, sells wholesale →</span> ${nm('mira')}<br>
      ${nm('mira')} <span class="arrow">pays wages →</span> ${nm('wren')} <span class="arrow">→ spends at the shop</span><br>
      ${nm('bram')} <span class="arrow">lends at ${Math.round((S.interest_rate || 0) * 100)}%, profits on repayment</span>
    </div>
    <div class="sec">purses</div>
    ${S.agents.map(a => `<div class="row"><span>${nm(a.id)}</span>
        <span class="r">${a.cash}c${a.debt ? ` · <span class="neg">owes ${a.debt}c</span>` : ''}</span></div>`).join('')}
    <div class="row"><span><b>Bank reserves</b></span><span class="r">${S.bank_reserves}c</span></div>
    <div class="sec">employment</div>${jobs}
    <div class="sec">debt</div>${debts}
    <div class="sec">shelves · cost → price · margin</div>${shelves}
    <div class="sec">where the coin went</div>${flows}`;
}

function renderMinds() {
  minds.innerHTML = S.agents.map(a => `
    <div class="mind" style="border-left:3px solid ${a.color}">
      <h4 style="color:${a.color}">${esc(a.name)} <span class="meta">— ${esc(a.role)}</span></h4>
      <div class="meta">goal: ${esc(a.goal)}</div>
      <div class="th">“${esc(a.thought)}”</div>
      <div class="meta">last: ${esc(a.action)}</div>
      <div class="meta">${a.cash}c · energy ${a.energy}${a.debt ? ' · owes ' + a.debt + 'c' : ''}
        ${Object.entries(a.inventory).filter(([, v]) => v).map(([k, v]) => `· ${esc(k)}×${v}`).join(' ')}</div>
    </div>`).join('');
}

function renderGraph(T) {
  gctx.clearRect(0, 0, gcv.width, gcv.height);
  const n = S.agents.length, cx = 165, cy = 150, R = 110, pos = {};
  S.agents.forEach((a, i) => {
    const th = -Math.PI / 2 + i * 2 * Math.PI / n;
    pos[a.id] = [cx + R * Math.cos(th), cy + R * Math.sin(th)];
  });
  for (const a of S.agents) for (const [bid, t] of Object.entries(a.trust)) {
    if (!pos[bid]) continue;
    gctx.strokeStyle = t >= 0 ? `rgba(110,210,140,${.15 + Math.abs(t) * .8})`
                              : `rgba(230,90,90,${.15 + Math.abs(t) * .8})`;
    gctx.lineWidth = 1 + Math.abs(t) * 4;
    gctx.beginPath(); gctx.moveTo(...pos[a.id]); gctx.lineTo(...pos[bid]); gctx.stroke();
  }
  for (const a of S.agents) {
    const [x, y] = pos[a.id];
    gctx.fillStyle = a.color; gctx.beginPath(); gctx.arc(x, y, 14, 0, 7); gctx.fill();
    gctx.fillStyle = '#e8e4f0'; gctx.font = '11px monospace'; gctx.textAlign = 'center';
    gctx.fillText(a.name, x, y + 27);
  }
  reltext.innerHTML = '<div class="dim" style="margin-top:8px">green = trust, red = distrust, thickness = strength</div>'
    + '<div class="dim">bank reserves: ' + S.bank_reserves + 'c</div>';
}

const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function renderShop() {
  shop.innerHTML = S.shop.map(i => `
    <div class="shopitem">
      ${i.image ? `<img src="${esc(i.image)}">` : '<div style="width:40px;height:40px;background:#2b2838;border-radius:4px"></div>'}
      <div class="n"><b>${esc(i.name)}</b> — ${i.price}c
        <span class="${i.qty ? 'dim' : 'neg'}">${i.qty ? '(' + i.qty + ' left)' : '(sold out)'}</span>
        <small>${esc(i.real_title || '')}</small></div>
      <button class="btn" data-buy="${esc(i.name)}" ${i.qty ? '' : 'disabled'}>Buy</button>
    </div>`).join('');
}
shop.addEventListener('click', e => {
  const b = e.target.closest('[data-buy]');
  if (b) send({type:'buy', item: b.dataset.buy});
});

function renderLog() {
  log.innerHTML = S.log.slice().reverse().map(l => {
    const hot = /^(RUMOUR|MARKET|SHORTAGE|FESTIVAL)/.test(l.text) || l.text.startsWith('You ');
    return `<div class="logline" ${hot ? 'style="color:var(--accent)"' : ''}>
              <b>${l.t}</b> ${esc(l.text)}</div>`;
  }).join('');
}
</script>
</body>
</html>
