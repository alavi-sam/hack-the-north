<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Untitled Town</title>
<style>
  /* A market town at dusk: old painted wood, lamplight, brass coins.
     Each resident's own colour is the accent — the same colour as their sprite. */
  :root {
    --wood:      #2a211a;   /* panel ground, dark walnut */
    --wood-deep: #1e1710;   /* recessed wells */
    --wood-line: #43362a;   /* seams */
    --paper:     #f2e4ce;   /* lamplit paper */
    --paper-dim: #ab977c;   /* faded ink */
    --brass:     #e8a33d;   /* lamplight, coins */
    --moss:      #8aa86a;
    --rust:      #c96a52;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: Inter, "Helvetica Neue", system-ui, -apple-system, sans-serif;
    --coin: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--wood-deep); color: var(--paper);
         font: 14px/1.5 var(--sans); }
  #wrap { display: flex; height: 100vh; }
  /* min-height:0 matters: a flex item will not shrink below its intrinsic size without
     it, and the canvas sets its own height attribute every frame — so it crept taller
     each time and pushed the toolbar clean off the bottom of the screen. */
  #left { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0;
          position: relative; overflow: hidden; }
  #stage { flex: 1; min-height: 0; position: relative; display: flex; }
  canvas#game { flex: 1; width: 100%; min-height: 0; display: block; }
  #bottom { flex: none; }

  /* ---- the bar the player acts from ---- */
  #bottom { border-top: 1px solid var(--wood-line); background: var(--wood);
            padding: 10px 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .field { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 240px; }
  select, input[type=text], button { font: inherit; }
  select, input[type=text] {
    background: var(--wood-deep); color: var(--paper);
    border: 1px solid var(--wood-line); border-radius: 3px; padding: 7px 9px; }
  input[type=text] { flex: 1; min-width: 0; font-family: var(--serif); font-size: 14px; }
  input[type=text]::placeholder { color: var(--paper-dim); font-style: italic; }
  :focus-visible { outline: 2px solid var(--brass); outline-offset: 1px; }
  .btn { background: transparent; color: var(--paper); border: 1px solid var(--wood-line);
         border-radius: 3px; padding: 7px 11px; cursor: pointer; }
  .btn:hover { border-color: var(--brass); color: var(--brass); }
  .btn.primary { background: var(--brass); border-color: var(--brass); color: #2a1f0c; font-weight: 600; }
  .btn.primary:hover { background: #f4b45a; color: #2a1f0c; }
  .btn[disabled] { opacity: .35; cursor: default; }
  .btn[disabled]:hover { border-color: var(--wood-line); color: var(--paper); }
  .stir { display: flex; align-items: center; gap: 6px; }
  .stir span { color: var(--paper-dim); font-size: 12px; }

  #link { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); z-index: 3;
          background: var(--rust); color: #fff4ec; padding: 8px 14px; border-radius: 4px;
          font-size: 13px; }
  /* Nothing leaves your purse unless you say yes here. */
  #civic { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 3;
           background: rgba(30,23,16,.94); border: 1px solid var(--brass);
           border-radius: 5px; padding: 11px 14px; max-width: 520px; text-align: center; }
  #civic:empty { display: none; }
  #recap { position: absolute; right: 14px; bottom: 14px; z-index: 5;
           width: min(360px, calc(100% - 28px)); background: var(--wood-deep);
           border: 1px solid var(--brass); border-radius: 5px; padding: 10px 12px;
           box-shadow: 0 6px 24px #0006; }
  #recap summary { cursor: pointer; color: var(--brass); font-weight: 600; }
  #recap-content { max-height: min(40vh, 320px); overflow-y: auto; font-size: 12px; }
  #recap-content p { margin: 10px 0; }
  #recap-content ul { padding-left: 18px; }
  #recap-content li { margin: 8px 0; }
  #civic h4 { margin: 0 0 4px; font: 600 15px var(--serif); color: var(--brass); }
  #civic p { margin: 0 0 9px; font-family: var(--serif); font-size: 14px; line-height: 1.45; }
  #civic .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  #offers { position: absolute; right: 14px; top: 14px; z-index: 3;
            display: flex; flex-direction: column; gap: 7px; width: 270px; }
  .offer { background: rgba(30,23,16,.94); border: 1px solid var(--brass);
           border-radius: 5px; padding: 10px 12px; }
  .offer p { margin: 0 0 8px; font-family: var(--serif); font-size: 13px; line-height: 1.4; }
  .offer .lapse { font-size: 10.5px; color: var(--paper-dim); margin-left: auto; align-self: center; }
  .offer p b { font-weight: 600; }
  .offer .row { display: flex; gap: 7px; }
  /* z-index matters here: the canvas sits in a positioned wrapper later in the DOM,
     so without it the town paints straight over your details. */
  #purse { position: absolute; left: 14px; top: 14px; z-index: 4; background: rgba(30,23,16,.88);
           border: 1px solid var(--wood-line); border-radius: 4px; padding: 8px 12px;
           font-size: 12px; color: var(--paper-dim); backdrop-filter: blur(3px); }
  #purse #when { color: var(--paper); }
  #purse #gov { margin-top: 3px; color: var(--brass); font-size: 11.5px; }
  #purse #job { margin-top: 5px; font-size: 11.5px; }
  #purse #bag { margin-top: 5px; display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
  #purse #bag button { background: none; border: 1px solid var(--wood-line); color: var(--paper);
                       border-radius: 3px; padding: 2px 7px; font-size: 11px; cursor: pointer; }
  #purse #bag button:hover { border-color: var(--brass); color: var(--brass); }
  #purse #bag .none { color: var(--paper-dim); font-size: 11px; }
  #purse b { font-family: var(--coin); font-size: 15px; color: var(--brass); font-variant-numeric: tabular-nums; }
  #purse kbd { font: inherit; font-family: var(--coin); color: var(--paper);
               border: 1px solid var(--wood-line); border-radius: 3px; padding: 0 4px; }

  /* ---- the panel of residents ---- */
  #right { width: 392px; background: var(--wood); border-left: 1px solid var(--wood-line);
           display: flex; flex-direction: column; }
  #tabs { display: flex; border-bottom: 1px solid var(--wood-line); padding: 0 6px; }
  #tabs button { flex: 1; background: none; border: 0; color: var(--paper-dim);
                 padding: 13px 1px 11px; cursor: pointer; font-size: 12px;
                 border-bottom: 2px solid transparent; margin-bottom: -1px; }
  #tabs button:hover { color: var(--paper); }
  #tabs button.on { color: var(--brass); border-bottom-color: var(--brass); }
  .pane { display: none; flex: 1; overflow-y: auto; overflow-x: hidden; padding: 14px; }
  .pane.on { display: block; }
  .quiet { color: var(--paper-dim); font-family: var(--serif); font-style: italic; }

  /* ---- a resident ---- */
  .person { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 12px;
            padding: 14px 0; border-bottom: 1px solid var(--wood-line); }
  .person:first-child { padding-top: 2px; }
  .person:last-child { border-bottom: 0; }
  .face { width: 52px; height: 52px; border-radius: 4px; background: var(--wood-deep); }
  .who { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .who h3 { margin: 0; font: 600 16px/1.2 var(--serif); }
  .who .trade { color: var(--paper-dim); font-size: 12px; }
  .thought { font-family: var(--serif); font-size: 14.5px; font-style: italic;
             line-height: 1.5; margin: 7px 0 0; color: #e6d7bd; }
  .doing { margin-top: 6px; font-size: 12px; color: var(--paper-dim); }
  .vitals { margin-top: 7px; display: flex; gap: 14px; font-size: 12px;
            align-items: baseline; flex-wrap: wrap; }
  .vitals .coins { font-family: var(--coin); color: var(--brass); font-variant-numeric: tabular-nums; }
  .vitals .owing { color: var(--rust); }
  .speaking .face { box-shadow: 0 0 0 2px var(--brass); }

  /* ---- conversations ---- */
  .thread { padding: 12px 0; border-bottom: 1px solid var(--wood-line); }
  .thread:last-child { border-bottom: 0; }
  .between { font-size: 12px; color: var(--paper-dim); margin-bottom: 9px;
             display: flex; justify-content: space-between; gap: 10px; }
  .thread.yours { border-left: 2px solid var(--brass); padding-left: 10px; }
  .picker { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .picker button { background: none; border: 1px solid var(--wood-line); color: var(--paper-dim);
                   border-radius: 99px; padding: 4px 11px; font-size: 12px; cursor: pointer; }
  .picker button:hover { color: var(--paper); }
  .picker button.on { border-color: var(--brass); color: var(--brass); }
  .said { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 10px; margin: 7px 0;
          font-family: var(--serif); font-size: 14px; line-height: 1.45; }
  .said .name { font-weight: 600; text-align: right; font-size: 13px; padding-top: 1px; }
  .still { color: var(--brass); }

  /* ---- ledger ---- */
  .heading { font-size: 12px; color: var(--paper-dim); margin: 20px 0 8px; }
  .heading:first-child { margin-top: 0; }
  .line { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0;
          border-bottom: 1px solid var(--wood-line); font-size: 13px; }
  .line:last-child { border-bottom: 0; }
  .line .amt { font-family: var(--coin); color: var(--brass); white-space: nowrap;
               font-variant-numeric: tabular-nums; }
  .line .amt.out { color: var(--rust); }
  .line .note { color: var(--paper-dim); font-size: 12px; }
  .chain { font-family: var(--serif); font-size: 14px; line-height: 1.85;
           background: var(--wood-deep); border-radius: 4px; padding: 12px 14px; }
  .chain em { color: var(--paper-dim); font-style: normal; font-size: 12.5px; font-family: var(--sans); }

  /* ---- market ---- */
  .stock { border: 1px solid var(--wood-line); border-radius: 6px; padding: 11px 12px;
           margin-bottom: 10px; }
  .stock .top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .stock h4 { margin: 0; font: 600 15px var(--serif); }
  .stock .px { font-family: var(--coin); font-size: 17px; color: var(--brass);
               font-variant-numeric: tabular-nums; }
  .stock .sub { color: var(--paper-dim); font-size: 11.5px; margin-top: 3px; }
  .stock .up { color: var(--moss); } .stock .down { color: var(--rust); }
  .stock svg { display: block; margin: 8px 0 4px; width: 100%; height: 34px; }
  .stock .row { display: flex; gap: 6px; align-items: center; margin-top: 7px; }
  .stock .row .btn { padding: 4px 10px; font-size: 12px; }
  .stock .mine { margin-left: auto; font-size: 11.5px; color: var(--paper-dim); }

  /* ---- shop ---- */
  .good { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; gap: 11px;
          align-items: center; padding: 11px 0; border-bottom: 1px solid var(--wood-line); }
  .good > div { min-width: 0; }
  .good .btn { white-space: nowrap; }
  .good:last-child { border-bottom: 0; }
  .good img, .good .noimg { width: 46px; height: 46px; border-radius: 3px; object-fit: cover;
                            background: var(--wood-deep); }
  .good h4 { margin: 0 0 2px; font: 600 14px var(--serif); }
  .good .real { display: block; color: var(--paper-dim); font-size: 11.5px;
                overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .good a.real { color: var(--brass); text-decoration: none; }
  .good a.real:hover { text-decoration: underline; }
  .good .tag { font-size: 12px; color: var(--paper-dim); }
  .good .tag b { font-family: var(--coin); color: var(--brass); font-variant-numeric: tabular-nums; }
  .good .out { color: var(--rust); }

  /* ---- news ---- */
  .news { font-family: var(--serif); font-size: 13.5px; line-height: 1.5;
          padding: 7px 0; border-bottom: 1px solid var(--wood-line); display: flex; gap: 10px; }
  .news:last-child { border-bottom: 0; }
  .news time { font-family: var(--coin); font-size: 11px; color: var(--paper-dim);
               flex: none; padding-top: 3px; }
  .news.loud { color: var(--brass); }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="wrap">
  <div id="left">
    <div id="link" hidden></div>
    <div id="offers"></div>
    <div id="purse"><span id="when">Day 1</span> &nbsp;·&nbsp; You carry <b id="coins">100</b> coins
      <div id="gov"></div>
      <div id="job"></div>
      <div id="bag"></div>
      &nbsp;<kbd>W A S D</kbd> walk &nbsp;<kbd>E</kbd> turn to someone</div>
    <div id="stage"><canvas id="game"></canvas>
      <details id="recap" hidden>
        <summary>While you were fast-forwarding</summary>
        <div id="recap-content" aria-live="polite"></div>
      </details>
      <div id="civic"></div></div>
    <div id="bottom">
      <div class="field">
        <select id="who" aria-label="Who you are speaking to"></select>
        <input id="line" type="text" placeholder="Say something…">
        <button class="btn primary" id="say">Say it</button>
        <button class="btn" id="whisper">Whisper a rumour</button>
        <button class="btn" id="work">Work a shift</button>
      </div>
      <div class="stir">
        <span>Stir things up</span>
        <button class="btn" data-ev="crash">Market crash</button>
        <button class="btn" data-ev="shortage">Shortage</button>
        <button class="btn" data-ev="festival">Festival</button>
        <button class="btn" data-ev="stranger">A stranger</button>
        <button class="btn" data-ev="election">Call an election</button>
      </div>
      <div class="stir">
        <label for="time-speed">Time</label>
        <select id="time-speed">
          <option value="1">Normal · 1×</option>
          <option value="5">Fast · 5×</option>
          <option value="10">Faster · 10×</option>
          <option value="20">Fastest · 20×</option>
        </select>
        <button class="btn" id="end-speedup" hidden>End fast-forward &amp; recap</button>
        <span id="speed-status" role="status"></span>
      </div>
    </div>
  </div>

  <div id="right">
    <div id="tabs">
      <button class="on" data-p="people">People</button>
      <button data-p="talk">Talk</button>
      <button data-p="shop">Shop</button>
      <button data-p="market">Market</button>
      <button data-p="ledger">Ledger</button>
      <button data-p="news">News</button>
    </div>
    <div class="pane on" id="people"></div>
    <div class="pane" id="talk"></div>
    <div class="pane" id="shop"></div>
    <div class="pane" id="market"></div>
    <div class="pane" id="ledger"></div>
    <div class="pane" id="news"></div>
  </div>
</div>

<script>
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
let S = null, keys = {}, player = { x: 17, y: 11 };
let lastPaint = 0, holding = false;
// A click needs mousedown and mouseup on the same element, so hold repaints
// from the moment a press starts until just after it finishes.
addEventListener('pointerdown', () => { holding = true; }, true);
addEventListener('pointerup', () => setTimeout(() => { holding = false; }, 150), true);
addEventListener('pointercancel', () => { holding = false; }, true);

const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* The socket is the only thing feeding this page, so a dropped connection used to
   freeze the town with no explanation. Reconnect, and say so while it is down. */
let ws, retry = 0;
const send = o => ws && ws.readyState === 1 && ws.send(JSON.stringify(o));

function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => { retry = 0; setLink(true); };
  ws.onclose = () => {
    setLink(false);
    retry = Math.min(retry + 1, 10);
    setTimeout(connect, 400 * retry);
  };
  ws.onerror = () => ws.close();
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type === 'state') {
      S = m;
      renderSpeed();
      try { render(); }
      catch (err) { console.error('render failed', err); }   // one bad frame must not stop the rest
    } else if (m.type === 'open_url' && m.url) window.open(m.url, '_blank');
  };
}
function setLink(up) {
  const el = document.getElementById('link');
  el.hidden = up;
  el.textContent = 'Lost the connection to the town. Reconnecting…';
}
connect();

let recapId = null;
document.getElementById('time-speed').onchange = e =>
  send({ type: 'speed', speed: Number(e.target.value) });
document.getElementById('end-speedup').onclick = () => send({ type: 'speed', speed: 1 });

function renderSpeed() {
  const speed = S.speed || 1;
  document.getElementById('time-speed').value = String(speed);
  document.getElementById('end-speedup').hidden = speed === 1;
  document.getElementById('speed-status').textContent = speed > 1 ? `${speed}× · town time` : '';
  const panel = document.getElementById('recap');
  const recap = S.speedup_summary;
  panel.hidden = speed > 1 || !recap;
  if (!recap || recap.id === recapId) return;
  recapId = recap.id;
  const events = recap.events.map(e =>
    `<li><b>Day ${e.day} · ${esc(e.category)}</b><br>${esc(e.text)}</li>`).join('');
  const markets = recap.markets.map(m => `<li>${esc(m.name)}: ${m.before === null
    ? `listed at ${m.after.toFixed(2)} coins`
    : `${m.before.toFixed(2)} → ${m.after.toFixed(2)} coins (${m.percent > 0 ? '+' : ''}${m.percent}%)`}</li>`).join('');
  document.getElementById('recap-content').innerHTML =
    `<p>Day ${recap.from_day} → ${recap.to_day} · ${recap.hours} town hours elapsed</p>` +
    (events ? `<ul>${events}</ul>` : '<p>No major events occurred during this fast-forward.</p>') +
    (recap.omitted ? `<p>${recap.omitted} additional events. Showing the first 200.</p>` : '') +
    (markets ? `<p><b>Stock market · start to finish</b></p><ul>${markets}</ul>` : '') +
    '<p>Major purchases: 20+ coins. Select a speed to watch another period.</p>';
  panel.open = true;
}

/* ---------- who each resident is, in their own terms ---------- */
const TRADE = {
  mira: 'keeps the shop',  bram: 'runs the bank', wren: 'works for wages',
  fig:  'grows the food',  kit:  'no honest trade',
  orla: 'sitting alderman', devi: 'speaks for the workers'
};
/* A face is the fastest way to stop reading someone as a row of numbers.
   Pixel rects, so the portraits match the sprites in the town. */
const FEATURE = {
  mira: c => `<rect x="4" y="13" width="16" height="3" fill="${c}"/>`,                 // shop collar
  bram: () => `<rect x="5" y="8" width="5" height="4" fill="none" stroke="#2a211a"/>
               <rect x="14" y="8" width="5" height="4" fill="none" stroke="#2a211a"/>
               <rect x="10" y="9" width="4" height="1" fill="#2a211a"/>`,              // spectacles
  wren: () => `<rect x="3" y="3" width="18" height="4" fill="#c86f6f"/>`,              // headscarf
  fig:  () => `<rect x="1" y="5" width="22" height="2" fill="#d9bb72"/>
               <rect x="5" y="2" width="14" height="3" fill="#d9bb72"/>`,              // straw hat
  kit:  () => `<path d="M2 8 L12 1 L22 8 L22 11 L2 11 Z" fill="#4a3350"/>`,            // hood
  orla: () => `<rect x="4" y="2" width="16" height="3" fill="#6d3f4b"/>
               <rect x="9" y="14" width="6" height="3" fill="#efe3cb"/>`,              // sash + collar
  devi: () => `<rect x="3" y="3" width="18" height="3" fill="#3f6d6a"/>
               <rect x="2" y="6" width="4" height="7" fill="#3f6d6a"/>`                // headwrap
};
function portrait(a) {
  const skin = '#e3bd95';
  return `<svg class="face" viewBox="0 0 24 24" shape-rendering="crispEdges" aria-hidden="true">
    <rect width="24" height="24" fill="${a.color}" opacity=".22"/>
    <rect x="4" y="15" width="16" height="9" fill="${a.color}"/>
    <rect x="6" y="4" width="12" height="12" fill="${skin}"/>
    <rect x="8" y="9" width="2" height="2" fill="#2a211a"/>
    <rect x="14" y="9" width="2" height="2" fill="#2a211a"/>
    <rect x="10" y="13" width="4" height="1" fill="#b4835f"/>
    ${(FEATURE[a.id] || (() => ''))(a.color)}
  </svg>`;
}
const feeling = e => e > 70 ? 'rested' : e > 40 ? 'flagging' : e > 15 ? 'weary' : 'worn out';

/* Trust reads better as a sentence than as a graph of signed decimals. */
function feelings(a, byId) {
  const warm = [], cold = [];
  for (const [id, t] of Object.entries(a.trust || {})) {
    const o = byId[id]; if (!o) continue;
    if (t >= 0.35) warm.push(o); else if (t <= -0.25) cold.push(o);
  }
  const names = xs => xs.map(o => `<b style="color:${o.color}">${esc(o.name)}</b>`).join(' and ');
  const bits = [];
  if (warm.length) bits.push(`trusts ${names(warm)}`);
  if (cold.length) bits.push(`${warm.length ? 'but has no time for' : 'has no time for'} ${names(cold)}`);
  return bits.length ? bits.join(' ') : 'has made up their mind about nobody yet';
}

/* ---------- input ---------- */
const line = document.getElementById('line'), who = document.getElementById('who');
addEventListener('keydown', e => {
  if (document.activeElement === line) { if (e.key === 'Enter') speak(); return; }
  keys[e.key.toLowerCase()] = true;
  if (e.key.toLowerCase() === 'e') { const n = nearest(); if (n) { who.value = n.id; line.focus(); } }
});
addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

function nearest() {
  if (!S) return null;
  let best = null, bd = 9;
  for (const a of S.agents) {
    const d = Math.hypot(a.x - player.x, a.y - player.y);
    if (d < bd) { bd = d; best = a; }
  }
  return best;
}
setInterval(() => {
  const dx = (keys.d || keys.arrowright ? 1 : 0) - (keys.a || keys.arrowleft ? 1 : 0);
  const dy = (keys.s || keys.arrowdown ? 1 : 0) - (keys.w || keys.arrowup ? 1 : 0);
  if (dx || dy) {
    player.x = Math.max(.5, Math.min(33.5, player.x + dx * .22));
    player.y = Math.max(.5, Math.min(19.5, player.y + dy * .22));
    send({ type: 'move', x: player.x, y: player.y });
  }
}, 50);

function speak() {
  const t = line.value.trim(); if (!t) return;
  send({ type: 'chat', agent: who.value, text: t }); line.value = '';
}
document.getElementById('say').onclick = speak;
document.getElementById('whisper').onclick = () => {
  const t = line.value.trim();
  if (!t) { line.placeholder = 'Type the rumour first, then whisper it.'; line.focus(); return; }
  send({ type: 'whisper', agent: who.value, text: t }); line.value = '';
};
document.getElementById('work').onclick = () => send({ type: 'work' });
document.getElementById('bag').addEventListener('click', e => {

document.querySelectorAll('[data-ev]').forEach(b =>

document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => {

document.getElementById('market').addEventListener('click', e => {

document.getElementById('talk').addEventListener('click', e => {

document.getElementById('civic').addEventListener('click', e => {

document.getElementById('offers').addEventListener('click', e => {

document.getElementById('shop').addEventListener('click', e => {

/* ---------- the town ---------- */
const ROOF = { shop: '#8c4b32', bank: '#54617e', farm: '#6b7a43', tavern: '#7a4a5e',
               square: '#7d7455', stall_a: '#9a6f3c', stall_b: '#9a6f3c' };
const WALL = { shop: '#e2cfab', bank: '#d3d2c6', farm: '#d8c69c', tavern: '#dec5a4' };
const TRIM = { shop: '#8a6a44', bank: '#79796f', farm: '#7d6a42', tavern: '#7b5a48' };

/* Windows live in one place so the building and the night lamps never drift apart. */
function windowSpots(px, py, pw, ph, T) {
  const eaves = ph * .42, base = py + eaves, body = ph - eaves;
  const wy = base + body * .17, ws = Math.min(T * .72, body * .38);
  return [[px + pw * .17, wy, ws], [px + pw * .83 - ws, wy, ws]];
}
const SIGN = { shop: 'The Shop', bank: 'The Bank', farm: 'The Farm', tavern: 'The Tavern',
               square: 'The Square', stall_a: 'Market pitch', stall_b: 'Market pitch' };
/* A plot with an owner gets their shop's name on the sign. */
const shopAt = place => (S.shops || []).find(sh => sh.place === place);

function render() {
  const T = Math.min(cv.clientWidth / S.map.w, cv.clientHeight / S.map.h);
  cv.width = cv.clientWidth; cv.height = cv.clientHeight;

  ctx.fillStyle = '#6f8a4c'; ctx.fillRect(0, 0, cv.width, cv.height);
  for (let i = 0; i < S.map.w; i++) for (let j = 0; j < S.map.h; j++) {
    const n = (i * 31 + j * 17) % 11;
    if (n < 3) {                                   // meadow patches, soft and irregular
      ctx.fillStyle = n === 0 ? '#76924f' : '#688045';
      ctx.fillRect((i + (n % 2) * .3) * T, (j + .2) * T, T * .8, T * .7);
    }
    if (n === 7) {                                 // grass tufts
      ctx.fillStyle = '#5d7a3f';
      ctx.fillRect((i + .35) * T, (j + .45) * T, T * .12, T * .3);
      ctx.fillRect((i + .55) * T, (j + .35) * T, T * .12, T * .4);
    }
  }

  // dirt paths from every door to the square
  const sq = S.map.places.square;
  const hub = [(sq[0] + sq[2] / 2) * T, (sq[1] + sq[3] / 2) * T];
  ctx.strokeStyle = '#a8916b'; ctx.lineWidth = T * .5; ctx.lineCap = 'round';
  for (const [n, p] of Object.entries(S.map.places)) {
    if (n === 'square') continue;
    ctx.beginPath(); ctx.moveTo((p[0] + p[2] / 2) * T, (p[1] + p[3]) * T);
    ctx.lineTo(hub[0], hub[1]); ctx.stroke();
  }

  scenery(T);
  for (const [n, p] of Object.entries(S.map.places)) building(n, p, T);
  nightfall(T);
  const cast = [...S.agents.map(a => ({ x: a.x, y: a.y, color: a.color, name: a.name,
                                       say: a.say, id: a.id })),
                { x: player.x, y: player.y, color: '#e8e2d4', name: 'You', say: '', you: true }];
  cast.sort((p, q) => p.y - q.y);                      // nearer characters drawn in front
  for (const c of cast) sprite(c, T);
  const taken = [];
  for (const c of cast) nameplate(c, T, taken);
  const bubbles = [];
  for (const c of cast) if (c.say) bubble(c.x * T, c.y * T - T * .62 * 1.55, c.say, T, bubbles);

  // The panels are rebuilt wholesale, which destroys every button in them. At the
  // frame rate that lands mid-click often enough to swallow the click entirely, so
  // repaint slowly, never while a pointer is down, and keep the reader's place.
  const now = performance.now();
  if (holding || now - lastPaint < 400) return;
  lastPaint = now;
  const pane = document.querySelector('.pane.on');
  const wasAt = pane ? pane.scrollTop : 0;

  document.getElementById('coins').textContent = S.player.cash;
  const c = S.clock ?? 0;
  const part = c < .25 ? 'Morning' : c < .5 ? 'Midday' : c < .72 ? 'Afternoon'
             : c < .85 ? 'Evening' : 'Night';
  document.getElementById('when').textContent = `Day ${S.day} · ${part}`;
  const gov = document.getElementById('gov');
  const P = S.player;
  const workBtn = document.getElementById('work');
  workBtn.textContent = P.shift ? `Working… ${P.shift}s` : 'Work a shift';
  workBtn.disabled = !!P.shift;
  document.getElementById('job').innerHTML = P.employer_name
    ? `Hired by <b style="color:var(--paper)">${esc(P.employer_name)}</b> at ${P.wage} a shift`
      + ` &nbsp;·&nbsp; vigour ${P.energy}`
    : `No work yet — odd jobs pay 3 &nbsp;·&nbsp; vigour ${P.energy}`;
  const bag = Object.entries(P.inventory || {}).filter(([, n]) => n > 0);
  document.getElementById('bag').innerHTML = bag.length
    ? 'Bag: ' + bag.map(([k, n]) =>
        `<button data-sell="${esc(k)}">${esc(k)} ×${n} — sell</button>`).join('')
    : '<span class="none">Your bag is empty</span>';
  gov.innerHTML = S.mayor_name
    ? `${esc(S.mayor_name)} governs — ${esc(S.policy)}`
    : `No mayor yet — the town votes in ${S.election_in} day${S.election_in === 1 ? '' : 's'}`;
  if (!who.options.length)
    who.innerHTML = S.agents.map(a => `<option value="${a.id}">${esc(a.name)}</option>`).join('');
  drawCivic(); drawOffers(); drawPeople(); drawMarket(); drawTalk(); drawShop(); drawLedger(); drawNews();
  if (pane) pane.scrollTop = wasAt;          // a repaint must not throw you back to the top
}

/* Fixed props, so the empty corners read as the edge of a town rather than dead space. */
const TREES = [[1,1],[1.2,8.6],[2.4,10.8],[0.9,17.4],[6.2,19],[12.4,1.2],[13.6,18.4],
               [20.4,1],[21.6,18.8],[32.6,1.4],[31.4,9],[32.8,16.8],[27,19],[16.8,4.2],[16.6,16]];
const CRATES = [[11.2,4.4],[11.9,5.1],[22.6,15.2],[12.2,14.6]];

function scenery(T) {
  for (const [x, y] of TREES) {
    const px = x * T, py = y * T;
    ctx.fillStyle = 'rgba(0,0,0,.18)';
    ctx.beginPath(); ctx.ellipse(px, py + T * .55, T * .5, T * .18, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#6b4c2e'; ctx.fillRect(px - T * .1, py - T * .1, T * .2, T * .65);
    ctx.fillStyle = '#41662f';
    ctx.beginPath(); ctx.moveTo(px, py - T * 1.5);
    ctx.lineTo(px + T * .72, py + T * .05); ctx.lineTo(px - T * .72, py + T * .05);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#4d7538';
    ctx.beginPath(); ctx.moveTo(px, py - T * 1.15);
    ctx.lineTo(px + T * .55, py - T * .25); ctx.lineTo(px - T * .55, py - T * .25);
    ctx.closePath(); ctx.fill();
  }
  for (const [x, y] of CRATES) {
    const px = x * T, py = y * T;
    ctx.fillStyle = '#9c7746'; ctx.fillRect(px, py, T * .62, T * .62);
    ctx.fillStyle = '#7d5c33'; ctx.fillRect(px, py + T * .27, T * .62, T * .08);
    ctx.fillRect(px + T * .27, py, T * .08, T * .62);
  }
  // the well in the middle of the square
  const sq = S.map.places.square, wx = (sq[0] + sq[2] / 2) * T, wy = (sq[1] + sq[3] / 2) * T;
  ctx.fillStyle = '#8d8d8d';
  ctx.beginPath(); ctx.ellipse(wx, wy, T * .55, T * .4, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#2f3a3f';
  ctx.beginPath(); ctx.ellipse(wx, wy, T * .34, T * .24, 0, 0, 7); ctx.fill();
}

/* One wash over the whole map, easing in and out, so dusk reads as dusk. */
function nightfall(T) {
  const c = S.clock ?? 0, from = 0.72, dusk = 0.06;
  let dark = 0;
  if (c >= from) dark = Math.min(1, (c - from) / dusk);
  if (c > 0.97) dark = Math.max(0, (1 - c) / 0.03);
  if (c < 0.04) dark = Math.max(dark, 1 - c / 0.04);
  if (dark <= 0.01) return;
  ctx.fillStyle = `rgba(18, 22, 48, ${0.62 * dark})`;
  ctx.fillRect(0, 0, cv.width, cv.height);
  for (const [n, p] of Object.entries(S.map.places)) {          // lamplight in the windows
    if (n === 'square' || (S.plots || []).includes(n)) continue;
    const [x, y, w, h] = p;
    ctx.fillStyle = `rgba(255, 198, 108, ${0.85 * dark})`;
    for (const [wx, wy, ws] of windowSpots(x * T, y * T, w * T, h * T, T))
      ctx.fillRect(wx, wy, ws, ws);
  }
}

function pane(x, y, s, trim) {
  ctx.fillStyle = trim; ctx.fillRect(x - s * .1, y - s * .1, s * 1.2, s * 1.2);
  ctx.fillStyle = '#9fc4d4'; ctx.fillRect(x, y, s, s);
  ctx.fillStyle = 'rgba(255,255,255,.32)'; ctx.fillRect(x, y, s * .44, s * .44);
  ctx.fillStyle = trim;                                        // glazing bars
  ctx.fillRect(x + s * .44, y, s * .12, s);
  ctx.fillRect(x, y + s * .44, s, s * .12);
  ctx.fillStyle = '#b9ac93';                                   // sill
  ctx.fillRect(x - s * .2, y + s * 1.1, s * 1.4, s * .16);
}

/* One characterful thing per building, so they are not four of the same house. */
function trimmings(name, px, py, pw, ph, T, base, foot) {
  if (name === 'shop') {
    // just under the windows and over the doorway, not across the glass
    const aw = pw * .54, ax = px + pw / 2 - aw / 2, ay = base + (foot - base) * .44, ah = T * .27;
    for (let i = 0; i < 6; i++) {
      ctx.fillStyle = i % 2 ? '#c4553f' : '#f4e8cf';
      ctx.fillRect(ax + i * (aw / 6), ay, aw / 6, ah);
    }
    ctx.fillStyle = 'rgba(0,0,0,.22)'; ctx.fillRect(ax, ay + ah, aw, T * .07);
    for (const bx of [px + T * .28, px + pw - T * .82]) {      // barrels by the door
      ctx.fillStyle = '#8a6136'; ctx.fillRect(bx, foot - T * .6, T * .52, T * .6);
      ctx.fillStyle = '#6d4c2a';
      ctx.fillRect(bx, foot - T * .44, T * .52, T * .08);
      ctx.fillRect(bx, foot - T * .22, T * .52, T * .08);
    }
  } else if (name === 'bank') {
    for (const cx of [px + pw * .29, px + pw * .71 - T * .28]) {
      ctx.fillStyle = '#eceadf'; ctx.fillRect(cx, base + (foot - base) * .2, T * .28, (foot - base) * .8);
      ctx.fillStyle = '#cdc9ba';
      ctx.fillRect(cx - T * .06, base + (foot - base) * .2, T * .4, T * .13);
      ctx.fillRect(cx - T * .06, foot - T * .15, T * .4, T * .15);
    }
  } else if (name === 'farm') {
    for (const hx of [px + T * .25, px + pw - T * 1.05]) {     // hay bales
      ctx.fillStyle = '#cfa94e'; ctx.fillRect(hx, foot - T * .5, T * .8, T * .5);
      ctx.fillStyle = '#b18c3a';
      ctx.fillRect(hx, foot - T * .35, T * .8, T * .07);
      ctx.fillRect(hx, foot - T * .17, T * .8, T * .07);
    }
  } else if (name === 'tavern') {
    const bx = px + pw * .74, by = base + (foot - base) * .2;  // a hanging sign
    ctx.fillStyle = '#5f4a33';
    ctx.fillRect(bx, by, T * .62, T * .09);
    ctx.fillRect(bx + T * .55, by, T * .08, T * .2);
    ctx.fillStyle = '#e6d8b8'; ctx.fillRect(bx + T * .28, by + T * .2, T * .62, T * .46);
    ctx.fillStyle = '#7b5a48'; ctx.fillRect(bx + T * .45, by + T * .3, T * .24, T * .26);
    ctx.fillStyle = '#e6d8b8'; ctx.fillRect(bx + T * .69, by + T * .35, T * .08, T * .12);
  }
}

function house(name, px, py, pw, ph, T) {
  const eaves = ph * .42, base = py + eaves, foot = py + ph, body = ph - eaves;
  const wall = WALL[name] || '#d8c7a6', trim = TRIM[name] || '#7d6a4e';

  ctx.fillStyle = 'rgba(0,0,0,.17)';
  ctx.beginPath(); ctx.ellipse(px + pw / 2, foot + T * .08, pw * .5, T * .2, 0, 0, 7); ctx.fill();

  ctx.fillStyle = wall; ctx.fillRect(px, base, pw, body);
  ctx.fillStyle = 'rgba(0,0,0,.07)'; ctx.fillRect(px, base, pw, body * .16);

  ctx.fillStyle = trim;                                        // timber framing
  const bays = Math.max(2, Math.round(pw / (T * 1.7)));
  for (let i = 0; i <= bays; i++) {
    const bx = Math.min(px + i * (pw / bays), px + pw - T * .13);
    ctx.fillRect(Math.max(bx, px), base, T * .13, body);
  }
  ctx.fillRect(px, base + body * .5, pw, T * .11);

  ctx.fillStyle = '#9c9483';                                   // stone footing
  ctx.fillRect(px, foot - T * .4, pw, T * .4);
  ctx.fillStyle = '#8a8271';
  for (let i = 0; i * T * .78 < pw; i++)
    ctx.fillRect(px + i * T * .78 + (i % 2 ? T * .22 : 0), foot - T * .4, T * .34, T * .4);

  const ovr = T * .36;                                         // roof, with shingle courses
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(px - ovr, base); ctx.lineTo(px + pw / 2, py); ctx.lineTo(px + pw + ovr, base);
  ctx.closePath(); ctx.clip();
  ctx.fillStyle = ROOF[name] || '#7d6a4e';
  ctx.fillRect(px - ovr, py, pw + ovr * 2, eaves);
  ctx.fillStyle = 'rgba(0,0,0,.14)';
  for (let yy = py + eaves * .26; yy < base; yy += Math.max(3, eaves * .21))
    ctx.fillRect(px - ovr, yy, pw + ovr * 2, Math.max(1.5, eaves * .07));
  ctx.fillStyle = 'rgba(255,255,255,.10)';
  ctx.fillRect(px + pw / 2 - T * .07, py, T * .14, eaves);
  ctx.restore();
  ctx.fillStyle = 'rgba(0,0,0,.26)'; ctx.fillRect(px - ovr, base - T * .11, pw + ovr * 2, T * .13);

  const chx = px + pw * .72;                                   // chimney
  ctx.fillStyle = '#7e6a56'; ctx.fillRect(chx, py + eaves * .14, T * .42, eaves * .62);
  ctx.fillStyle = '#6a5847'; ctx.fillRect(chx - T * .06, py + eaves * .14, T * .54, T * .14);

  for (const [wx, wy, ws] of windowSpots(px, py, pw, ph, T)) pane(wx, wy, ws, trim);

  const dw = Math.min(T * .8, pw * .22), dh = body * .54;      // door
  const dx = px + pw / 2 - dw / 2, dy = foot - dh;
  ctx.fillStyle = trim; ctx.fillRect(dx - T * .08, dy - T * .08, dw + T * .16, dh + T * .08);
  ctx.fillStyle = '#6b4a2c'; ctx.fillRect(dx, dy, dw, dh);
  ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.fillRect(dx + dw * .16, dy + dh * .12, dw * .68, dh * .36);
  ctx.fillStyle = '#e0b559'; ctx.fillRect(dx + dw * .74, dy + dh * .52, T * .11, T * .11);
  ctx.fillStyle = '#a89a80'; ctx.fillRect(dx - T * .14, foot, dw + T * .28, T * .15);

  trimmings(name, px, py, pw, ph, T, base, foot);
}

function building(name, [x, y, w, h], T) {
  const px = x * T, py = y * T, pw = w * T, ph = h * T, eaves = ph * .34;
  const mine = shopAt(name), plot = (S.plots || []).includes(name);

  if (name === 'square') {
    ctx.fillStyle = '#a08f68'; ctx.fillRect(px, py, pw, ph);
    ctx.fillStyle = '#9a8a64';
    for (let i = 0; i < w; i++) for (let j = 0; j < h; j++)
      if ((i * 5 + j * 3) % 4 === 0) ctx.fillRect((x + i) * T, (y + j) * T, T, T);
  } else if (plot && !mine) {                       // an empty pitch, waiting for someone
    ctx.fillStyle = '#8b7a55';
    ctx.fillRect(px + T * .2, py + ph * .45, pw - T * .4, ph * .5);
    ctx.fillStyle = '#6f5c38';
    for (const [sx, sy] of [[0, 0], [1, 0], [0, 1], [1, 1]])
      ctx.fillRect(px + T * .15 + sx * (pw - T * .5), py + ph * .3 + sy * (ph * .45),
                   T * .18, ph * .38);
    const sx = px + pw / 2 - T * .75, sy = py + T * .1;
    ctx.fillStyle = '#6f5c38'; ctx.fillRect(px + pw / 2 - T * .07, sy, T * .14, ph * .5);
    ctx.fillStyle = '#e3d5b4'; ctx.fillRect(sx, sy, T * 1.5, T * .62);
    ctx.strokeStyle = '#6f5c38'; ctx.lineWidth = 1.5;
    ctx.strokeRect(sx, sy, T * 1.5, T * .62);
    ctx.font = `${Math.max(8, T * .34)}px "Iowan Old Style", Palatino, Georgia, serif`;
    ctx.textAlign = 'center'; ctx.fillStyle = '#4a3c25';
    ctx.fillText('to let', px + pw / 2, sy + T * .46);
  } else if (plot) {                                // a market stall, open to the square
    ctx.fillStyle = 'rgba(0,0,0,.15)';
    ctx.beginPath(); ctx.ellipse(px + pw / 2, py + ph, pw * .46, T * .16, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#6b5433';
    ctx.fillRect(px + T * .1, py + eaves, T * .2, ph - eaves);
    ctx.fillRect(px + pw - T * .3, py + eaves, T * .2, ph - eaves);
    ctx.fillStyle = '#c9ae7c'; ctx.fillRect(px + T * .05, py + ph - T * .55, pw - T * .1, T * .55);
    ctx.fillStyle = '#a98c5d'; ctx.fillRect(px + T * .05, py + ph - T * .55, pw - T * .1, T * .1);
    for (let i = 0; i < 3; i++) {                   // goods on the counter
      ctx.fillStyle = ['#b5503f', '#c9a13f', '#6f9152'][i];
      ctx.fillRect(px + pw * (.2 + i * .25), py + ph - T * .8, T * .3, T * .26);
    }
    const stripes = 6, sw = pw / stripes;
    for (let i = 0; i < stripes; i++) {
      ctx.fillStyle = i % 2 ? '#c4553f' : '#f4e8cf';
      ctx.fillRect(px + i * sw, py, sw, eaves);
      ctx.beginPath();                              // scalloped hem
      ctx.arc(px + i * sw + sw / 2, py + eaves, sw / 2, 0, Math.PI);
      ctx.fill();
    }
    ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.fillRect(px, py, pw, T * .1);
  } else {
    house(name, px, py, pw, ph, T);
  }

  const label = mine ? mine.name : (SIGN[name] || name);      // a nameboard, not bare text
  ctx.font = `${Math.max(10, T * .42)}px "Iowan Old Style", Palatino, Georgia, serif`;
  ctx.textAlign = 'center';
  const bw = ctx.measureText(label).width + T * .55, bh = Math.max(13, T * .58);
  const bx = px + pw / 2 - bw / 2, by = py + ph + T * .26;
  ctx.fillStyle = '#5f4a33'; ctx.fillRect(bx - 2, by - 2, bw + 4, bh + 4);
  ctx.fillStyle = '#e8dcc0'; ctx.fillRect(bx, by, bw, bh);
  ctx.fillStyle = 'rgba(0,0,0,.12)'; ctx.fillRect(bx, by + bh - bh * .22, bw, bh * .22);
  ctx.fillStyle = '#3a2d1c'; ctx.fillText(label, px + pw / 2, by + bh * .73);
}

function sprite({ x, y, color, id, you }, T) {
  const px = x * T, py = y * T, u = T * 0.62;        // u = one "pixel" of the character
  ctx.fillStyle = 'rgba(0,0,0,.24)';
  ctx.beginPath(); ctx.ellipse(px, py + u * 1.15, u * .8, u * .26, 0, 0, 7); ctx.fill();

  ctx.fillStyle = color;                              // body
  ctx.fillRect(px - u * .62, py - u * .1, u * 1.24, u * 1.25);
  ctx.fillStyle = 'rgba(0,0,0,.16)';                  // legs
  ctx.fillRect(px - u * .46, py + u * .8, u * .34, u * .35);
  ctx.fillRect(px + u * .12, py + u * .8, u * .34, u * .35);
  ctx.fillStyle = color;                              // arms
  ctx.fillRect(px - u * .84, py + u * .05, u * .22, u * .7);
  ctx.fillRect(px + u * .62, py + u * .05, u * .22, u * .7);

  ctx.fillStyle = '#e3bd95';                          // head
  ctx.fillRect(px - u * .52, py - u * 1.2, u * 1.04, u * 1.1);
  ctx.fillStyle = '#2a211a';                          // eyes
  ctx.fillRect(px - u * .3, py - u * .82, u * .18, u * .2);
  ctx.fillRect(px + u * .12, py - u * .82, u * .18, u * .2);
  ctx.fillStyle = '#b4835f';                          // mouth
  ctx.fillRect(px - u * .14, py - u * .46, u * .28, u * .08);

  const hat = { wren: '#c86f6f', fig: '#d9bb72', kit: '#4a3350', mira: '#8a5a2c',
                bram: '#3f4a63', orla: '#6d3f4b', devi: '#3f6d6a' }[id];
  if (hat) {
    ctx.fillStyle = hat;
    ctx.fillRect(px - u * .58, py - u * 1.34, u * 1.16, u * .26);
    if (id === 'fig') ctx.fillRect(px - u * .88, py - u * 1.12, u * 1.76, u * .12);  // straw brim
    if (id === 'kit') ctx.fillRect(px - u * .58, py - u * 1.08, u * .14, u * .55);   // hood side
  }
  if (id === 'bram') {                                // spectacles
    ctx.strokeStyle = '#2a211a'; ctx.lineWidth = Math.max(1, u * .07);
    ctx.strokeRect(px - u * .34, py - u * .86, u * .26, u * .28);
    ctx.strokeRect(px + u * .08, py - u * .86, u * .26, u * .28);
  }
  if (you) {
    ctx.strokeStyle = '#fff8e8'; ctx.lineWidth = Math.max(1.5, u * .1);
    ctx.strokeRect(px - u * .62, py - u * 1.24, u * 1.24, u * 2.4);
  }

}

/* Characters bunch up in the square, so a nameplate steps down until it has clear air. */
function nameplate({ x, y, name }, T, taken) {
  const fs = Math.max(11, T * .42), px = x * T;
  ctx.font = `600 ${fs}px Inter, system-ui, sans-serif`;
  ctx.textAlign = 'center';
  const w = ctx.measureText(name).width + 10, h = fs * 1.28;
  let bx = px - w / 2, by = y * T + T * .62 * 1.28;
  for (let guard = 0; guard < 6; guard++) {
    const hit = taken.find(r => bx < r.x + r.w && bx + w > r.x && by < r.y + r.h && by + h > r.y);
    if (!hit) break;
    by = hit.y + hit.h + 2;
  }
  taken.push({ x: bx, y: by, w, h });
  ctx.fillStyle = 'rgba(30,23,16,.78)';
  ctx.beginPath(); ctx.roundRect(bx, by, w, h, 3); ctx.fill();
  ctx.fillStyle = '#f2e4ce';
  ctx.fillText(name, px, by + fs);
}

function bubble(px, py, text, T, taken) {
  const fs = Math.max(11, T * .38);
  ctx.font = `${fs}px "Iowan Old Style", Palatino, Georgia, serif`;
  const lines = []; let cur = '';
  for (const w of text.split(' ')) {
    if ((cur + ' ' + w).length > 28) { lines.push(cur); cur = w; }
    else cur = cur ? cur + ' ' + w : w;
  }
  if (cur) lines.push(cur);
  const lh = fs * 1.35;
  const wd = Math.max(...lines.map(l => ctx.measureText(l).width)) + 16;
  const ht = lines.length * lh + 10;
  let bx = Math.max(4, Math.min(cv.width - wd - 4, px - wd / 2));   // keep it on screen
  let by = py - ht;

  // two people talking side by side used to print one bubble on top of the other
  for (let guard = 0; guard < 8; guard++) {
    const hit = taken.find(r => bx < r.x + r.w && bx + wd > r.x && by < r.y + r.h && by + ht > r.y);
    if (!hit) break;
    by = hit.y - ht - 6;                       // stack upward, out of the way
    if (by < 4) { by = hit.y + hit.h + 6; }    // unless there is no room above
  }
  taken.push({ x: bx, y: by, w: wd, h: ht });

  ctx.fillStyle = '#f7efdd';
  ctx.beginPath(); ctx.roundRect(bx, by, wd, ht, 5); ctx.fill();
  const tipx = Math.max(bx + 8, Math.min(bx + wd - 8, px));
  ctx.beginPath(); ctx.moveTo(tipx - 5, by + ht); ctx.lineTo(tipx + 5, by + ht);
  ctx.lineTo(tipx, by + ht + 7); ctx.fill();
  ctx.fillStyle = '#2a211a'; ctx.textAlign = 'center';
  lines.forEach((l, i) => ctx.fillText(l, bx + wd / 2, by + fs + 4 + i * lh));
}

/* ---------- panels ---------- */
function drawCivic() {
  const el = document.getElementById('civic');
  if (S.ballot && S.ballot.length) {
    el.innerHTML = `<h4>Election day</h4>
      <p>${S.ballot.map(c => `<b style="color:${c.color}">${esc(c.name)}</b> would ${esc(c.pitch)}`)
             .join('<br>')}</p>
      <div class="row">${S.your_vote
        ? `<span class="quiet">You backed ${esc(S.your_vote)}. The town counts at dawn.</span>`
        : S.ballot.map(c =>
            `<button class="btn primary" data-vote="${c.id}">Vote ${esc(c.name)}</button>`).join('')}</div>`;
  } else {
    el.innerHTML = '';
  }
}

function drawOffers() {
  const ps = S.proposals || [];
  document.getElementById('offers').innerHTML = ps.slice(-2).map(p => `
    <div class="offer">
      <p><b style="color:${p.color}">${esc(p.name)}</b> offers you ${esc(p.text)}.</p>
      <div class="row">
        <button class="btn primary" data-yes="${p.id}">Accept</button>
        <button class="btn" data-no="${p.id}">No thanks</button>
        <span class="lapse">lapses shortly</span>
      </div>
    </div>`).join('');
}

function drawPeople() {
  const byId = {}; S.agents.forEach(x => byId[x.id] = x);
  document.getElementById('people').innerHTML = S.agents.map(a => `
    <article class="person ${a.say ? 'speaking' : ''}">
      ${portrait(a)}
      <div>
        <div class="who">
          <h3 style="color:${a.color}">${esc(a.name)}</h3>
          <span class="trade">${TRADE[a.id] || esc(a.role)}</span>
        </div>
        <p class="thought">${esc(a.thought)}</p>
        <div class="doing">${esc(a.action)}</div>
        <div class="doing">${feelings(a, byId)}</div>
        <div class="vitals">
          <span class="coins">${a.cash} coins</span>
          <span>${feeling(a.energy)}</span>
          ${a.action === 'slept' ? '<span>asleep</span>' : ''}
          ${a.debt ? `<span class="owing">owes ${a.debt}</span>` : ''}
          ${a.employer ? `<span>hired by ${esc((S.agents.find(x => x.id === a.employer) || {}).name || a.employer)}</span>` : ''}
        </div>
      </div>
    </article>`).join('');
}

let talkWith = 'all';         // 'all', 'mine', or an agent id

function drawTalk() {
  const all = S.conversations || [];
  const people = S.agents.map(a => a.id);
  const pick = (id, label) =>
    `<button class="${talkWith === id ? 'on' : ''}" data-with="${id}">${esc(label)}</button>`;

  let shown = all;
  if (talkWith === 'mine') shown = all.filter(c => c.mine);
  else if (talkWith !== 'all') shown = all.filter(c => c.a === talkWith || c.b === talkWith);

  const picker = `<div class="picker">
      ${pick('all', 'Everyone')}${pick('mine', 'Your chats')}
      ${people.map(id => pick(id, (S.agents.find(a => a.id === id) || {}).name)).join('')}
    </div>`;

  const body = shown.length ? shown.map(c => {
    // your own threads read as a chat you can scroll back through
    const other = c.mine ? (c.a === 'stranger' ? 1 : 0) : null;
    const title = c.mine
      ? `You and <b style="color:${c.colors[other]}">${esc(c.names[other])}</b>`
      : `<b style="color:${c.colors[0]}">${esc(c.names[0])}</b> and
         <b style="color:${c.colors[1]}">${esc(c.names[1])}</b>`;
    return `<section class="thread ${c.mine ? 'yours' : ''}">
      <div class="between">
        <span>${title}</span>
        <span class="${c.closed ? '' : 'still'}">${c.closed ? c.lines.length + ' lines' : 'still talking'}</span>
      </div>
      ${c.lines.map(l => `<div class="said">
          <span class="name" style="color:${l.speaker === c.a ? c.colors[0] : c.colors[1]}">${esc(l.name)}</span>
          <span>${esc(l.text)}</span></div>`).join('')}
    </section>`;
  }).join('') : '<p class="quiet">Nothing said here yet.</p>';

  document.getElementById('talk').innerHTML = picker + body;
}

function spark(h, col) {
  if (!h || h.length < 2) return '';
  const lo = Math.min(...h), hi = Math.max(...h), span = (hi - lo) || 1;
  const pts = h.map((v, i) =>
    `${(i / (h.length - 1) * 100).toFixed(1)},${(30 - (v - lo) / span * 28).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 100 32" preserveAspectRatio="none">
            <polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.6"
                      vector-effect="non-scaling-stroke"/></svg>`;
}

function drawMarket() {
  const ms = S.market || [];
  document.getElementById('market').innerHTML = ms.length ? ms.map(m => {
    const h = m.history || [], first = h[0] ?? m.price, move = m.price - first;
    const mood = m.sentiment > 0.05 ? 'well thought of'
               : m.sentiment < -0.05 ? 'talked down' : 'steady';
    return `<div class="stock">
      <div class="top">
        <h4 style="color:${m.color}">${esc(m.name)}</h4>
        <span class="px">${m.price}
          <span class="${move >= 0 ? 'up' : 'down'}" style="font-size:12px">
            ${move >= 0 ? '+' : ''}${move.toFixed(0)}</span></span>
      </div>
      <div class="sub">worth ${m.fair} on the books · ${esc(mood)} ·
        ${m.float} of ${20} shares on offer · took ${m.takings} today</div>
      ${spark(h, m.color)}
      <div class="row">
        <button class="btn" data-sh="${m.owner}" data-n="1" data-buy="1">Buy 1</button>
        <button class="btn" data-sh="${m.owner}" data-n="3" data-buy="1">Buy 3</button>
        <button class="btn" data-sh="${m.owner}" data-n="1">Sell 1</button>
        <button class="btn" data-sh="${m.owner}" data-n="3">Sell 3</button>
        <span class="mine">${m.yours ? `you hold ${m.yours}` : 'you hold none'}</span>
      </div>
      <div class="sub">held by ${Object.entries(m.holders).map(([k, v]) =>
        `${esc(k)} ${v}`).join(', ') || 'nobody'}</div>
    </div>`;
  }).join('') : '<p class="quiet">No business has floated shares yet.</p>';
}

function drawShop() {
  // Real Shopify listings, open to anyone with coin. Buy a case, sell it on for more.
  const sup = (S.supplier || []).map(o => `
    <div class="good">
      ${o.image ? `<img src="${esc(o.image)}" alt="">` : '<div class="noimg"></div>'}
      <div>
        <h4>${esc(o.name)}</h4>
        <span class="real">${esc(o.real_title)}</span>
        <span class="tag">case of 3 — <b>${o.case}</b> coins (${o.unit} each)</span>
      </div>
      <button class="btn" data-case="${esc(o.name)}">Buy case</button>
    </div>`).join('') || '<p class="quiet">The supplier has nothing in just now.</p>';

  document.getElementById('shop').innerHTML =
    `<div class="heading">From the supplier — buy low, sell on</div>${sup}
     <div class="heading">On sale in town</div>` + S.shop.map(i => `
    <div class="good">
      ${i.image ? `<img src="${esc(i.image)}" alt="">` : '<div class="noimg"></div>'}
      <div>
        <h4>${esc(i.name)}</h4>
        <span class="real">${esc(i.shop || '')} — ${esc(i.real_title || '')}</span>
        ${i.url ? `<a class="real" href="${esc(i.url)}" target="_blank" rel="noopener">view the real product</a>` : ''}
        <span class="tag"><b>${i.price}</b> coins
          ${i.qty ? `· ${i.qty} on the shelf` : '<span class="out">· none left</span>'}</span>
      </div>
      <button class="btn" data-buy="${esc(i.name)}" ${i.qty ? '' : 'disabled'}>Buy</button>
    </div>`).join('');
}

function drawLedger() {
  const A = {}; S.agents.forEach(a => A[a.id] = a);
  const nm = id => A[id] ? `<b style="color:${A[id].color}">${esc(A[id].name)}</b>` : esc(id);
  const rows = xs => xs.length ? xs.join('') : '<p class="quiet">Nothing yet.</p>';

  document.getElementById('ledger').innerHTML = `
    <div class="heading">How the money moves</div>
    <div class="chain">
      The townsfolk buy from ${nm('mira')}<br>
      ${nm('fig')} grows food and sells it to her wholesale<br>
      She pays ${nm('wren')} out of the till, and ${nm('wren')} spends it back in the shop<br>
      ${nm('bram')} lends at ${Math.round((S.interest_rate || 0) * 100)}%
        <em>and only profits when a debt comes back</em>
    </div>

    <div class="heading">Purses</div>
    ${S.agents.map(a => `<div class="line"><span>${nm(a.id)}</span>
      <span class="amt">${a.cash}${a.debt ? ` <span class="out">−${a.debt} owed</span>` : ''}</span></div>`).join('')}
    <div class="line"><span>The bank's reserves</span><span class="amt">${S.bank_reserves}</span></div>

    <div class="heading">The town</div>
    <div class="line"><span>Treasury</span><span class="amt">${S.treasury ?? 0}</span></div>
    <div class="line"><span>Mayor</span><span class="r">${esc(S.mayor_name || 'none yet')}</span></div>
    <div class="line"><span>Law in force</span><span class="r">${esc(S.policy || 'none')}</span></div>

    <div class="heading">Who works for whom</div>
    ${rows(S.agents.filter(a => a.employer).map(a =>
      `<div class="line"><span>${nm(a.id)} works for ${nm(a.employer)}</span>
       <span class="amt">${a.wage} a shift</span></div>`))}

    <div class="heading">Shops in town</div>
    ${(S.shops || []).map(sh => `<div class="line">
       <span><b style="color:${sh.color}">${esc(sh.name)}</b>
         <span class="note">kept by ${esc(sh.owner_name)}</span></span>
       <span class="amt">${sh.goods.reduce((n, g) => n + g.qty, 0)} on the shelves</span></div>`).join('')}

    ${(S.shops || []).map(sh => `
      <div class="heading">${esc(sh.name)} — cost → price</div>
      ${sh.goods.length ? sh.goods.map(g => `<div class="line">
         <span>${esc(g.name)} <span class="note">${g.qty ? g.qty + ' left' : 'sold out'}</span></span>
         <span class="amt">${g.cost} → ${g.price}
           <span class="${g.price - g.cost >= 0 ? '' : 'out'}">(${g.price - g.cost >= 0 ? '+' : ''}${g.price - g.cost})</span>
         </span></div>`).join('') : '<p class="quiet">Nothing on the shelves yet.</p>'}`).join('')}

    <div class="heading">Where the coin went</div>
    ${rows((S.flows || []).slice().reverse().map(f =>
      `<div class="line"><span>${esc(f.from)} paid ${esc(f.to)}
        <span class="note">${esc(f.why)}</span></span>
       <span class="amt">${f.amount}</span></div>`))}`;
}

function drawNews() {
  document.getElementById('news').innerHTML = S.log.slice().reverse().map(l => {
    const loud = /whispered|market crashed|shortage|festival|poached|could not make payroll|stranger arrived/i
                   .test(l.text) || l.text.startsWith('You ');
    return `<div class="news ${loud ? 'loud' : ''}"><time>${l.t}</time><span>${esc(l.text)}</span></div>`;
  }).join('');
}
