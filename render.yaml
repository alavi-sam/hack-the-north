services:
  - type: web
    name: untitled-town
    runtime: python
    plan: free
    # The town is one long-lived process that owns the world; never scale past one
    # instance, or each viewer gets a different town.
    numInstances: 1
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: OPENAI_API_KEY
        sync: false          # set in the Render dashboard; never commit the key
      - key: OPENAI_MODEL
        value: gpt-4.1-nano
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
